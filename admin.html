<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MandiMart – Direct Farmer-to-Buyer Marketplace</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="./style.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - MandiMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar-mandi">
        <a class="brand" href="index.html">🌾 Mandi<span>Mart</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="admin.html">Admin</a>
            <button class="btn-login" onclick="logout()">Logout</button>
        </div>
    </nav>

    <main class="container" style="min-height:60vh">
        <section class="section">
            <h2>Admin Dashboard</h2>
            
            <!-- Stats Cards -->
            <div class="row g-3 mb-3">
                <div class="col-md-3">
                    <div class="stat-box">
                        <div class="stat-number" id="adUsers">0</div>
                        <div class="stat-label">Users</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-box">
                        <div class="stat-number" id="adCrops">0</div>
                        <div class="stat-label">Crop Listings</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-box">
                        <div class="stat-number" id="adAuctions">0</div>
                        <div class="stat-label">Auctions</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-box">
                        <div class="stat-number" id="adValue">₹0</div>
                        <div class="stat-label">Trade Value</div>
                    </div>
                </div>
            </div>
            
            <!-- Admin Tabs -->
            <ul class="nav nav-pills nav-pills-mandi mb-3">
                <li class="nav-item">
                    <a class="nav-link active" href="#" onclick="adminTab('users',this)">Users</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="adminTab('crops',this)">Crops</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="adminTab('transactions',this)">Transactions</a>
                </li>
            </ul>
            
            <div id="adminTable"></div>
        </section>
    </main>

    <footer>
        🌾 MandiMart — Admin Control Panel<br>
        <small>Manage users, crops, and transactions</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadAdminData);
    </script>
</body>
</html>
