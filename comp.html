<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Products - MandiMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar-mandi">
        <a class="brand" href="index.html">🌾 Mandi<span>Mart</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="mandi.html">Mandi Prices</a>
            <a href="crops.html">Crops</a>
            <a href="auctions.html">Auctions</a>
            <a href="compare.html">Compare</a>
            <a href="aicompare.html">AI Compare</a>
            <button class="btn-login" onclick="window.location.href='login.html'">Login / Register</button>
        </div>
    </nav>

    <main class="container" style="min-height:60vh">
        <section class="section">
            <h2>Product Comparison</h2>
            
            <div class="compare-selector">
                <div class="row g-3 mb-3">
                    <div class="col-md-5">
                        <select id="compA" class="form-select" onchange="compareProducts()">
                            <option>Select Product A</option>
                        </select>
                    </div>
                    <div class="col-md-2 text-center vs-text">VS</div>
                    <div class="col-md-5">
                        <select id="compB" class="form-select" onchange="compareProducts()">
                            <option>Select Product B</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div id="compareResult">
                <!-- Comparison table appears here -->
            </div>
        </section>
    </main>

    <footer>
        🌾 MandiMart — Compare and choose the best<br>
        <small>Make informed buying decisions</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            populateCompare();
        });
    </script>
</body>
</html>
