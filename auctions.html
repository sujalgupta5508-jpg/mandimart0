<!DOCTYPE html>
<html lang="en">
<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MandiMart – Direct Farmer-to-Buyer Marketplace</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="./style.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Auctions - MandiMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar-mandi">
        <a class="brand" href="index.html">🌾 Mandi<span>Mart</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="mandi.html">Mandi Prices</a>
            <a href="crops.html">Crops</a>
            <a href="auctions.html">Auctions</a>
            <a href="compare.html">Compare</a>
            <a href="aicompare.html">AI Compare</a>
            <button class="btn-login" onclick="window.location.href='login.html'">Login / Register</button>
        </div>
    </nav>

    <main class="container" style="min-height:60vh">
        <section class="section">
            <h2>Live Auctions</h2>
            
            <div class="row">
                <!-- Create Auction -->
                <div class="col-md-4">
                    <div class="card form-card">
                        <h5 class="card-title">Create Auction</h5>
                        <form id="auctionForm" onsubmit="return createAuction(event)">
                            <input id="aucCrop" class="form-control" placeholder="Crop name" required>
                            <input id="aucQty" class="form-control" type="number" placeholder="Quantity (quintals)" required>
                            <input id="aucBase" class="form-control" type="number" placeholder="Base price (₹/q)" required>
                            <input id="aucDur" class="form-control" type="number" placeholder="Duration (minutes)" required>
                            <button type="submit" class="btn btn-mandi w-100">Start Auction</button>
                        </form>
                    </div>
                </div>
                
                <!-- Auction List -->
                <div class="col-md-8">
                    <div class="row g-3" id="auctionList">
                        <!-- Filled by JavaScript -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        🌾 MandiMart — Real-time auctions for best prices<br>
        <small>Highest bid wins when timer runs out</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadAuctions);
    </script>
</body>
</html>
