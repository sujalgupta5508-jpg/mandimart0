<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Compare Products - MandiMart</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- MandiMart CSS -->
    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar-mandi">

        <a class="brand" href="index.html">
            🌾 Mandi<span>Mart</span>
        </a>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="mandi.html">Mandi Prices</a>

            <a href="crops.html">Crops</a>

            <a href="auctions.html">Auctions</a>

            <a href="compare.html">Compare</a>

            <a href="aicompare.html">AI Compare</a>

            <button
                class="btn-login"
                onclick="window.location.href='login.html'"
            >
                Login / Register
            </button>

        </div>

    </nav>


    <!-- ================= MAIN ================= -->

    <main class="container" style="min-height: 60vh;">

        <section class="section">

            <h2>Product Comparison</h2>

            <!-- PRODUCT SELECTORS -->

            <div class="compare-selector">

                <div class="row g-3 mb-3 align-items-center">

                    <!-- PRODUCT A -->

                    <div class="col-md-5">

                        <select
                            id="compA"
                            class="form-select form-select-lg"
                        >

                            <option value="">
                                Select Product A
                            </option>

                        </select>

                    </div>


                    <!-- VS -->

                    <div class="col-md-2 text-center">

                        <div class="vs-text">
                            VS
                        </div>

                    </div>


                    <!-- PRODUCT B -->

                    <div class="col-md-5">

                        <select
                            id="compB"
                            class="form-select form-select-lg"
                        >

                            <option value="">
                                Select Product B
                            </option>

                        </select>

                    </div>

                </div>

            </div>


            <!-- ================= RESULT ================= -->

            <!-- IMPORTANT:
                 There must be ONLY ONE compareResult -->

            <div
                id="compareResult"
                class="mt-5"
            >

                <div class="alert alert-info text-center">
                    Select two products to compare.
                </div>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        🌾 MandiMart — Compare and choose the best
        <br>

        <small>
            Make informed buying decisions
        </small>

    </footer>


    <!-- ================= SCRIPTS ================= -->

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- MandiMart JavaScript -->
    <script src="./main.js"></script>

    <!-- Start Comparison -->
    <script>

        document.addEventListener("DOMContentLoaded", function () {

            if (typeof populateCompare === "function") {

                populateCompare();

            } else {

                console.error(
                    "populateCompare() was not found in main.js"
                );

            }

        });

    </script>

</body>
</html>
