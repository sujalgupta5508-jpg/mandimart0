<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MandiMart – Direct Farmer-to-Buyer Marketplace</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="./style.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Listings - MandiMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar-mandi">
        <a class="brand" href="index.html">🌾 Mandi<span>Mart</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="mandi.html">Mandi Prices</a>
            <a href="crops.html">Crops</a>
            <a href="auctions.html">Auctions</a>
            <a href="compare.html">Compare</a>
            <a href="aicompare.html">AI Compare</a>
            <button class="btn-login" onclick="window.location.href='login.html'">Login / Register</button>
        </div>
    </nav>

    <main class="container" style="min-height:60vh">
        <section class="section">
            <h2>Crop Listings</h2>
            
            <div class="row">
                <!-- Add Crop Form -->
                <div class="col-md-4">
                    <div class="card form-card">
                        <h5 class="card-title">Add New Crop</h5>
                        <form id="cropForm" onsubmit="return addCrop(event)">
                            <input id="cropName" class="form-control" placeholder="Crop name (e.g. Tomato)" required>
                            <input id="cropQty" class="form-control" type="number" placeholder="Quantity (quintals)" required>
                            <select id="cropGrade" class="form-select">
                                <option value="A">A Grade</option>
                                <option value="B">B Grade</option>
                                <option value="C">C Grade</option>
                            </select>
                            <input id="cropPrice" class="form-control" type="number" placeholder="Expected price (₹/q)" required>
                            <input id="cropImage" class="form-control" type="file" accept="image/*">
                            <button type="submit" class="btn btn-mandi w-100">List Crop</button>
                        </form>
                    </div>
                </div>
                
                <!-- Crop List -->
                <div class="col-md-8">
                    <div class="row g-3" id="cropList">
                        <!-- Filled by JavaScript -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        🌾 MandiMart — List your crops directly to buyers<br>
        <small>No middlemen, maximum profit</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadCrops);
    </script>
</body>
</html>
