<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MandiMart – Direct Farmer-to-Buyer Marketplace</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="./style.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandi Prices - MandiMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Same Navbar as index.html -->
    <nav class="navbar-mandi">
        <a class="brand" href="index.html">🌾 Mandi<span>Mart</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="mandi.html">Mandi Prices</a>
            <a href="crops.html">Crops</a>
            <a href="auctions.html">Auctions</a>
            <a href="compare.html">Compare</a>
            <a href="aicompare.html">AI Compare</a>
            <button class="btn-login" onclick="window.location.href='login.html'">Login / Register</button>
        </div>
    </nav>

    <main class="container" style="min-height:60vh">
        <section class="section">
            <h2>Live Mandi Prices</h2>
            
            <!-- Search and Filter -->
            <div class="search-bar">
                <input id="mandiSearch" class="form-control" placeholder="Search crop or mandi..." oninput="filterMandi()">
                <button class="btn-mandi" onclick="findNearby()">
                    <i class="bi bi-geo-alt"></i> Find Nearby
                </button>
            </div>
            
            <div id="nearbyMsg" class="alert alert-success" style="display:none"></div>
            
            <!-- Price Table -->
            <div class="table-responsive">
                <table class="table price-table">
                    <thead>
                        <tr>
                            <th>Crop</th>
                            <th>Mandi</th>
                            <th>Min (₹/q)</th>
                            <th>Max (₹/q)</th>
                            <th>Modal (₹/q)</th>
                            <th>Trend</th>
                            <th>Distance</th>
                        </tr>
                    </thead>
                    <tbody id="mandiBody">
                        <!-- Filled by JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        🌾 MandiMart — Transparent Agricultural Marketplace<br>
        <small>Real-time mandi prices for informed selling</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script>
        // Load mandi data when page loads
        document.addEventListener('DOMContentLoaded', loadMandiData);
    </script>
</body>
</html>
